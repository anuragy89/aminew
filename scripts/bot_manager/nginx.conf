# Bot Manager Nginx Configuration
# This file proxies requests to the bot manager service
#
# Install location: /etc/nginx/conf.d/bot-manager.conf

upstream bot_manager {
    server 127.0.0.1:6969;
    keepalive 32;
}

server {
    listen 80;
    # Change this to your domain or IP
    server_name _;

    # Bot Manager API endpoints
    location /api/bots {
        proxy_pass http://bot_manager/bots;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass through the auth header
        proxy_set_header X-Manager-Secret $http_x_manager_secret;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint (no auth required)
    location /api/health {
        proxy_pass http://bot_manager/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Direct access to manager (alternative path)
    location /manager/ {
        proxy_pass http://bot_manager/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Manager-Secret $http_x_manager_secret;
    }

    # Optional: Add SSL configuration for production
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
}
